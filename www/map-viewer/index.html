<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>Proscenic live map</title>
		<link
			rel="stylesheet"
			href="./viewer.css?revision=20260921-3"
		/>
		<script src="/lib/js/socket.io.js"></script>
	</head>
	<body>
		<main class="viewer-shell">
			<section
				id="viewport"
				aria-label="Proscenic live map"
			>
				<div id="mapStage">
					<img
						id="mapImage"
						alt="Proscenic live map"
						draggable="false"
					/>
					<div
						id="zoneLabels"
						aria-hidden="true"
					></div>
				</div>
				<p id="empty">Waiting for map data…</p>
				<button
					id="zoneStart"
					type="button"
					hidden
				>
					Ausgewählte Zonen reinigen
				</button>
				<p
					id="interactionStatus"
					role="status"
					aria-live="polite"
				></p>
				<div
					class="viewer-controls"
					aria-label="Map controls"
				>
					<button
						type="button"
						data-zoom="in"
						aria-label="Zoom in"
					>
						+
					</button>
					<button
						type="button"
						data-zoom="out"
						aria-label="Zoom out"
					>
						−
					</button>
					<button
						type="button"
						data-zoom="reset"
						aria-label="Reset map view"
					>
						⌂
					</button>
				</div>
			</section>
		</main>
		<script src="./viewer.js?revision=20260921-3"></script>
	</body>
</html>
