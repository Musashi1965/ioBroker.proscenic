name: Feature request
description: Propose a capability or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the user-visible need without private device/account information.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed behavior
      description: Include expected states/commands and compatibility impact if known.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Device evidence
      options:
        - Idea only
        - Observed in the official app
        - Verified on real hardware
    validations:
      required: true
