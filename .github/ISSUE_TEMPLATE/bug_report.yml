name: Bug report
description: Report reproducible adapter behavior without private installation data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, serial numbers, private IPs, device names, maps, packet captures, or unredacted logs.
  - type: input
    id: adapter-version
    attributes:
      label: Adapter version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: M7 Pro (do not enter the serial number)
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node.js, js-controller, Admin, operating system
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: redacted-logs
    attributes:
      label: Redacted logs
      description: Remove all installation-specific and secret values before posting.
